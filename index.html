<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal | Smart Routine &amp; Product Advisor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
  

    <!-- Layout Direction Control -->
    <div class="direction-control">
      <label for="directionToggle">Display Direction</label>
      <select id="directionToggle" aria-label="Display direction">
        <option value="ltr">English — Left to Right</option>
        <option value="rtl">العربية — Right to Left</option>
      </select>
    </div>

    <!-- Header / Branding -->
    
      <header class="site-header">
        <div class="header-inner">
          <img src="img/loreal-logo.png" alt="L'Oréal" class="logo" />
          <span class="header-divider" aria-hidden="true"></span>
          <h1 class="site-title">YOUR PERSONAL ROUTINE ADVISOR</h1>
        </div>
      </header>

      <!-- Category Filter -->
      <div class="search-section">
        <select id="categoryFilter">
          <option value="" disabled selected>Choose a Category</option>
          <option value="cleanser">Cleansers</option>
          <option value="skincare">Skincare</option>
          <option value="moisturizer">Moisturizers & Treatments</option>
          <option value="haircare">Haircare</option>
          <option value="makeup">Makeup</option>
          <option value="hair color">Hair Color</option>
          <option value="hair styling">Hair Styling</option>
          <option value="men's grooming">Men's Grooming</option>
          <option value="suncare">Suncare</option>
          <option value="fragrance">Fragrance</option>
        </select>
      </div>

      <!-- Product Search -->
<div class="search-container">
  <label for="productSearch">Find Your Perfect Product</label>
  <input
    type="search"
    id="productSearch"
    placeholder="Search by product name, brand, or keyword..."
    autocomplete="off"
  />
</div>
      <!-- Products Grid -->
      <div id="productsContainer" class="products-grid"></div>

      <!-- Product Details Modal -->
      <dialog id="productDetailsModal" class="product-modal">
        <div class="modal-content">
          <button
            type="button"
            id="closeProductModal"
            class="modal-close"
            aria-label="Close product details"
          >
            &times;
          </button>

          <h2 id="modalProductName"></h2>
          <p id="modalProductBrand"></p>
          <p id="modalProductDescription"></p>
          <button type="button" id="modalProductAction" class="modal-action">
            Choose Product
          </button>
        </div>
      </dialog>

      <!-- Selected Products -->
      <div class="selected-products">
        <h2>Selected Products</h2>
        <div id="selectedProductsList"></div>
        <button id="resetConsultation" class="reset-consultation-btn" type="button">
          Begin a New Consultation
        </button>
        <button id="generateRoutine" class="generate-btn">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Routine
        </button>
      </div>

      <!------- Chat Area ------->
      <section class="chatbox">
        <h2>Let's Build Your Routine</h2>
        <div id="chatWindow" class="chat-window" aria-live="polite"></div>

        <form id="chatForm" class="chat-form">
          <label for="userInput" class="visually-hidden">Message</label>
          <input
            id="userInput"
            name="userInput"
            type="text"
            placeholder="Ask me about products or routines…"
            autocomplete="off"
            required
          />
          <button type="submit" id="sendBtn">
            <i class="fa-solid fa-paper-plane"></i>
            <span class="visually-hidden">Send</span>
          </button>
        </form>
      </section>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2025 L'Oréal. All rights reserved.</p>
        <nav>
          <!-- These URLs are placeholders -->
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="https://unpkg.com/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
